<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d6f2"/>
      <stop offset=".55" stop-color="#dcc7e6"/>
      <stop offset="1" stop-color="#eccdd8"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3a63"/>
      <stop offset="1" stop-color="#4a5c93"/>
    </linearGradient>
    <linearGradient id="hairHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c7fc2"/>
      <stop offset="1" stop-color="#4a5c93"/>
    </linearGradient>
    <radialGradient id="skinshade" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffe3d6"/>
      <stop offset="1" stop-color="#f4c3b3"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="900" height="1100" fill="url(#bgh)"/>
  <circle cx="640" cy="230" r="260" fill="#ffe9c9" opacity=".35" filter="url(#soft)"/>
  <circle cx="180" cy="850" r="220" fill="#b9a7ff" opacity=".28" filter="url(#soft)"/>

  <!-- collar / shirt -->
  <path d="M110 1100V790Q330 690 560 760Q650 790 760 750V1100Z" fill="#f4f1ee"/>
  <path d="M320 780Q450 820 590 770L560 1000Q450 1040 350 1000Z" fill="#e7e2dd"/>
  <path d="M150 1100V820Q230 780 300 800L330 1100Z" fill="#20222c"/>
  <path d="M620 780Q700 800 770 770V1100H620Z" fill="#20222c"/>

  <!-- neck -->
  <path d="M370 640Q380 720 420 760Q470 790 520 760Q555 725 560 645Z" fill="url(#skinshade)"/>

  <!-- back hair -->
  <path d="M195 470Q150 260 330 150Q470 60 610 150Q740 250 690 470Q705 640 640 760Q660 560 590 470Q520 640 500 760Q520 560 460 480Q420 630 380 750Q400 560 340 480Q300 620 250 720Q290 560 230 480Q210 480 195 470Z" fill="url(#hair)"/>

  <!-- face -->
  <ellipse cx="450" cy="430" rx="152" ry="168" fill="url(#skinshade)"/>

  <!-- ear -->
  <path d="M300 430q-26 10 -24 42q4 30 30 28" fill="#f4c3b3"/>

  <!-- front hair / bangs -->
  <path d="M300 330Q330 200 450 190Q580 195 610 330Q600 260 520 260Q560 320 545 380Q505 280 460 275Q485 335 470 400Q420 290 385 285Q400 345 392 400Q345 300 320 320Q330 360 318 400Q292 370 300 330Z" fill="url(#hair)"/>
  <path d="M255 380Q235 330 260 280Q235 340 260 400Q245 430 260 470Q235 430 255 380Z" fill="url(#hairHi)"/>

  <!-- hair bun + ribbon -->
  <ellipse cx="470" cy="150" rx="98" ry="86" fill="url(#hair)"/>
  <ellipse cx="470" cy="150" rx="98" ry="86" fill="none" stroke="url(#hairHi)" stroke-width="4" opacity=".5"/>
  <path d="M420 118q22 -18 50 -8q22 10 12 32q-16 20 -44 10q-22 -10 -18 -34Z" fill="#20222c"/>
  <circle cx="452" cy="128" r="7" fill="#3a3d4d"/>

  <!-- eyebrow -->
  <path d="M368 388q30 -16 56 -6" stroke="#33324a" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- eye -->
  <path d="M362 420q28 -30 74 -14q10 26 -8 44q-38 22 -66 -4q-10 -14 0 -26Z" fill="#fffdf8"/>
  <ellipse cx="405" cy="428" rx="24" ry="27" fill="#c99a3e"/>
  <ellipse cx="405" cy="428" rx="24" ry="27" fill="none" stroke="#7a5a20" stroke-width="2"/>
  <circle cx="397" cy="418" r="7" fill="#fff" opacity=".9"/>
  <path d="M362 420q28 -30 74 -14" stroke="#2c2b3d" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="358" cy="470" rx="20" ry="11" fill="#f2a8a0" opacity=".55"/>

  <!-- nose + mouth hint -->
  <path d="M338 460q-8 10 0 18" stroke="#e5a892" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hand near mouth -->
  <path d="M245 560Q215 520 235 480Q255 450 285 470Q300 500 280 530Q310 510 330 530Q345 555 320 580Q350 575 355 600Q350 630 315 630Q270 630 245 600Z" fill="url(#skinshade)"/>
  <path d="M270 480q10 -18 26 -14" stroke="#e5a892" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>

  <!-- leaf -->
  <path d="M180 470Q150 430 175 385Q210 355 250 385Q265 425 235 460Q205 485 180 470Z" fill="#7fae6a"/>
  <path d="M182 468Q210 430 245 390" stroke="#5c8a4a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- sleeve -->
  <path d="M120 760Q150 640 260 610Q220 690 245 760Q190 730 150 780Z" fill="#f4f1ee"/>
  <path d="M120 760Q150 640 260 610" stroke="#e2ddd6" stroke-width="4" fill="none"/>

  <!-- ribbon tie -->
  <path d="M330 640Q345 690 320 740Q300 700 310 660Z" fill="#20222c"/>
  <path d="M330 640Q345 690 320 740" stroke="#40425a" stroke-width="2" fill="none"/>
</svg>
